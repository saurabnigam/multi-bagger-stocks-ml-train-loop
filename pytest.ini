[pytest]
testpaths = tests test_quant_math.py test_optimizer.py
python_files = test_*.py
markers =
    network: tests requiring real outbound network access (opt-in via QUANT_NETWORK=1)
    legacy_real: full-source migration on real historical database (opt-in via QUANT_LEGACY_REAL=1)
    performance: long-running performance runs (opt-in via QUANT_PERFORMANCE=1)
addopts = -m "not network and not legacy_real and not performance"
